<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ben's Tracker</title>
  <meta name="theme-color" content="#0f1b2d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 id="name">Tracker</h1>
    <p class="targets" id="targets-line"></p>
    <p class="lead" id="week-sentence">Loading…</p>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main id="sections">
    <section data-section="tiles" aria-label="Summary">
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="card" data-section="chart">
      <div class="card-head">
        <h2>Weight</h2>
        <button type="button" class="chip" id="zoom">Zoom to my weights</button>
      </div>
      <div class="chart" id="chart"></div>
    </section>

    <section class="card" data-section="weeks">
      <h2>Weekly averages</h2>
      <div id="weeks"></div>
    </section>

    <section class="card" data-section="days">
      <h2>Every day, meal by meal</h2>
      <div id="days"></div>
    </section>

    <section class="card" data-section="lifts">
      <h2>Lifts</h2>
      <div id="lifts"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
